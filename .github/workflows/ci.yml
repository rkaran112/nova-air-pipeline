# On every push and pull request: lint, then run the tests, on Windows, macOS and
# Linux with the oldest and newest supported Python. The tests build their own tiny
# warehouse from tests/fixtures, so no data or secrets are needed here.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
